<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bookhunt.eu</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- PicoCSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <!-- Leaflet MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span style="font-size: 1.5rem">📚</span>
        <h1>bookhunt.eu</h1>
      </div>
      <div class="search-container">
        <input
          type="search"
          id="searchInput"
          placeholder="Search title, author or shelf"
        />
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="app-main">
      <div class="map-container" id="map"></div>

      <aside class="sidebar">
        <div id="bookshelfInfo" class="bookshelf-info hidden">
          <div class="info-header">
            <h2 id="shelfName">Select a bookshelf</h2>
            <p id="shelfDesc" class="text-muted"></p>
          </div>
          <div id="bookList" class="book-list">
            <!-- Books will be rendered here -->
            <div class="empty-state">
              <span style="font-size: 3rem">📍</span>
              <p>Click a marker on the map to view books.</p>
            </div>
          </div>
        </div>

        <div id="searchResults" class="search-results hidden">
          <div class="info-header">
            <h2>Search Results</h2>
          </div>
          <div id="searchList" class="book-list">
            <!-- Search results will be rendered here -->
          </div>
        </div>
      </aside>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
