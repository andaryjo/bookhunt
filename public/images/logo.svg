<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Post Gradient -->
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Shorter Post -->
    <rect x="238" y="365" width="36" height="70" rx="4" fill="url(#postGrad)" />
    
    <!-- Expanded Library House Body -->
    <rect x="106" y="125" width="300" height="250" rx="18" fill="url(#wallGrad)" />
    
    <!-- Expanded Roof -->
    <polygon points="76,135 256,20 436,135" fill="url(#roofGrad)" />
    <!-- Expanded Roof Rim -->
    <polygon points="66,139 256,10 446,139 430,151 256,32 82,151" fill="#f59e0b" />

    <!-- Reduced Glass Door Outer Border -->
    <rect x="201" y="200" width="110" height="90" rx="10" fill="#0f172a" />
    <!-- Reduced Glass Door Glass (Semi-transparent dark overlay) -->
    <rect x="206" y="205" width="100" height="80" rx="6" fill="#1e293b" />

    <!-- Books Inside Library (re-aligned to fit smaller pane) -->
    <!-- Book 1 (Mustard Yellow) -->
    <rect x="215" y="215" width="18" height="60" rx="3" fill="#eab308" />
    <rect x="218" y="221" width="12" height="4" fill="#ca8a04" />
    <rect x="218" y="261" width="12" height="4" fill="#ca8a04" />

    <!-- Book 2 (Soft Coral) -->
    <rect x="237" y="223" width="18" height="52" rx="3" fill="#f43f5e" />
    <path d="M240,229 L252,229 M240,233 L252,233" stroke="#be123c" stroke-width="2" stroke-linecap="round" />
    <circle cx="246" cy="255" r="3.5" fill="#be123c" />

    <!-- Book 3 (Ocean Blue, Leaning) -->
    <g transform="translate(258, 220) rotate(12)">
      <rect x="0" y="0" width="18" height="56" rx="3" fill="#0ea5e9" />
      <rect x="3" y="6" width="12" height="3" fill="#0284c7" />
      <rect x="3" y="47" width="12" height="3" fill="#0284c7" />
    </g>

    <!-- Glass Reflection Highlight -->
    <path d="M210,210 L300,278" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.15" />
    <path d="M225,210 L285,260" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.1" />
  </g>
</svg>
