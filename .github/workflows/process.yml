name: Process Photos and Update Data

on:
  schedule:
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BRUTOR_GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download photos from queue
        env:
          GH_TOKEN: ${{ secrets.BRUTOR_GH_PAT }}
        run: node scripts/download_photos.js

      - name: Run photo analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run process

      - name: Cleanup processed photos
        env:
          GH_TOKEN: ${{ secrets.BRUTOR_GH_PAT }}
        run: node scripts/cleanup_photos.js

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.BRUTOR_GH_PAT }}
        run: |
          git config --local user.email "bookhuntbrutor@gemueseoderobst.de"
          git config --local user.name "Brutor"
          git add public/data/
          git add photos/
          git add queue/
          git add queue.json || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "update book data from automated analysis"
            git push
            echo "Changes pushed, triggering deployment..."
            gh workflow run deploy-pages.yml
          else
            echo "No changes to commit."
          fi
